name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Strict lint for Phoenix recovery changes
        run: ruff check src/omega/phoenix/benchmark.py tests/test_phoenix_benchmark.py
      - name: Legacy repository lint (known existing findings)
        run: ruff check src tests || true
      - run: python -m pytest tests -v --tb=short
